name: Fabric CI/CD Deployment

on:
  push:
    branches: 
      - '*dev*'
      - '*prod*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: FABRIC-CI/CD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Azure login (service principal creds)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Install dependencies
        run: pip install --upgrade fabric_cicd msal

      - name: Run deployment script
        run: python deploy.py
        env:
          ENVIRONMENT: ${{ github.ref_name }}
          AZURE_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          AZURE_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          AZURE_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}